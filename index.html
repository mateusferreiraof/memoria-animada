<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Memória Animada</title>
        <link rel="stylesheet" href="assets/css/style.css">
        <script src="assets/js/script.js" defer></script>
        <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="row-1">
        <h1 class="h1-row-1">Memória Animada</h1>
        <h2 class="h2-row-1">Encontre os pares e descubra as animações.</h2>
    </div>
    <div class="row-2">
        <div class="hud-row-2">
            <h3 class="h3-hud-row-2">TENTATIVAS</h3>
            <p class="p-hud-row-2">0</p>
        </div>
        <div class="hud-row-2">
            <h3 class="h3-hud-row-2">PARES ENCONTRADOS</h3>
            <p class="p-hud-row-2">0 / 6</p>
        </div> 
        <div class="hud-row-2">
            <h3 class="h3-hud-row-2">TEMPO</h3>
            <p class="p-hud-row-2">00:00</p>
        </div>
        <button class="hud-row-2 button-hud-row-2">
            <h3 class="h3-hud-row-2">↺ Reiniciar</h3>
        </button>
    </div>
    <div class="row-3">
        <button class="card-back css">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-css"></i>
                </span>
            </div>
        </button>
        <button class="card-back css">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-css"></i>
                </span>
            </div>
        </button>
        <button class="card-back javascript">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-js"></i>
                </span>
            </div>
        </button>
        <button class="card-back javascript">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-js"></i>
                </span>
            </div>
        </button>
        <button class="card-back html">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-html5"></i>
                </span>
            </div>
        </button>
        <button class="card-back html">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-html5"></i>
                </span>
            </div>
        </button>
        <button class="card-back github">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-github"></i>
                </span>
            </div>
        </button>
        <button class="card-back github">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-github"></i>
                </span>
            </div>
        </button>
        <button class="card-back fontawesome">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-font-awesome"></i>
                </span>
            </div>
        </button>
        <button class="card-back fontawesome">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-brands fa-font-awesome"></i>
                </span>
            </div>
        </button>
        <button class="card-back code">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-solid fa-code"></i>
                </span>
            </div>
        </button>
        <button class="card-back code">
            <div class="card-conteudo">
                <span class="conteudo-verso">✦</span>
                <span class="conteudo-frente">
                    <i class="fa-solid fa-code"></i>
                </span>
            </div>
        </button>
</body>
</html>
